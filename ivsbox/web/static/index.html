<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IVSBox 运维终端</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 登录遮罩：静态页面本身放行，但没有任何设备数据；数据全由 JS 经 REST 现拉 -->
  <div id="login" class="login hidden">
    <form id="loginForm" class="login-box" autocomplete="off">
      <h1>IVSBox 运维终端</h1>
      <label for="pass">访问口令</label>
      <input id="pass" type="password" name="pass" required>
      <button type="submit">登录</button>
      <p id="loginMsg" class="msg" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="nav">
      <div class="brand">IVSBox</div>
      <nav id="navList" class="nav-list"></nav>
      <div class="nav-foot">
        <span id="verLabel" class="dim"></span>
        <button id="logoutBtn" class="link" type="button">退出</button>
      </div>
    </aside>
    <main id="content" class="content">
      <div id="toast" class="toast hidden" role="status"></div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
