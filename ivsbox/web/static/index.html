<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IVSBox 运维终端</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 登录遮罩：静态页面本身放行，但没有任何设备数据；数据全由 JS 经 REST 现拉 -->
  <div id="login" class="login hidden">
    <form id="loginForm" class="login-box" autocomplete="off">
      <h1>IVSBox 运维终端</h1>
      <label for="user">账号</label>
      <input id="user" type="text" name="user" required autocomplete="username">
      <label for="pass">密码</label>
      <input id="pass" type="password" name="pass" required autocomplete="current-password">
      <button type="submit">登录</button>
      <p id="loginMsg" class="msg" role="alert"></p>
    </form>
  </div>

  <!-- 改密卡片（M10）：出厂默认密码时**强制**走这张卡，改完才进主界面；
       主界面侧栏的"改密"按钮复用同一张卡（那时会多要一个"原密码"）。 -->
  <div id="chpass" class="login hidden">
    <form id="chpassForm" class="login-box" autocomplete="off">
      <h1 id="chpassTitle">修改登录密码</h1>
      <p id="chpassWhy" class="hint"></p>
      <div id="oldWrap" class="hidden">
        <label for="oldpass">原密码</label>
        <input id="oldpass" type="password" name="oldpass" autocomplete="current-password">
      </div>
      <label for="newpass">新密码</label>
      <input id="newpass" type="password" name="newpass" required autocomplete="new-password">
      <label for="newpass2">确认新密码</label>
      <input id="newpass2" type="password" name="newpass2" required autocomplete="new-password">
      <div class="actions">
        <button type="submit">确认修改</button>
        <button type="button" id="chpassCancel" class="ghost hidden">返回</button>
      </div>
      <p id="chpassMsg" class="msg" role="alert"></p>
      <!-- 规则原文由 app.js 填入（与服务端 web/src/iv_web.h 的 IV_WEB_PASS_HINT_TEXT
           是同一句话，源头是参考实现 index.shtml:976）。 -->
      <pre id="passRule" class="rule"></pre>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="nav">
      <div class="brand">IVSBox</div>
      <nav id="navList" class="nav-list"></nav>
      <div class="nav-foot">
        <span id="verLabel" class="dim"></span>
        <button id="chpassBtn" class="link" type="button">改密</button>
        <button id="logoutBtn" class="link" type="button">退出</button>
      </div>
    </aside>
    <main id="content" class="content"></main>
    <!-- 提示条必须在 #content **外面**：go() 每次切页都 `#content.innerHTML=''`，
         放在里面等于登录（showApp→go）那一刻就被删掉，之后每次 toast() 都在
         `$('#toast')` 上抛 TypeError。而 toast 抛错的后果不是"少一个提示"：
         applyChanges 里 toast 之后的 `st.ver = ...` 与 `after()` 全部不执行 ⇒
         保存后版本号不更新、表单不重载，下一次保存必然撞版本冲突（D-16，10-21）。 -->
    <div id="toast" class="toast hidden" role="status"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
