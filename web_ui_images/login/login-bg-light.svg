<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="浅色登录背景">
  <defs>
    <linearGradient id="bg-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fe"/>
      <stop offset=".5" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#e3ecfa"/>
    </linearGradient>
    <radialGradient id="lglow" cx=".78" cy=".18" r=".7">
      <stop offset="0" stop-color="#2f7bff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#2f7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lglow2" cx=".12" cy=".88" r=".6">
      <stop offset="0" stop-color="#19c37d" stop-opacity=".10"/>
      <stop offset="1" stop-color="#19c37d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1f6feb" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-l)"/>
  <rect width="1600" height="900" fill="url(#lgrid)"/>
  <rect width="1600" height="900" fill="url(#lglow)"/>
  <rect width="1600" height="900" fill="url(#lglow2)"/>

  <!-- 网络拓扑（右上，柔和） -->
  <g stroke="#1f6feb" stroke-opacity=".14" stroke-width="1.6" fill="none">
    <path d="M1080 180 L1260 110 L1450 190"/>
    <path d="M1260 110 L1320 260 L1450 190"/>
    <path d="M1320 260 L1500 330"/>
  </g>
  <g fill="#1f6feb">
    <circle cx="1080" cy="180" r="5" fill-opacity=".28"/>
    <circle cx="1260" cy="110" r="6" fill-opacity=".35"/>
    <circle cx="1450" cy="190" r="5" fill-opacity=".25"/>
    <circle cx="1320" cy="260" r="5" fill-opacity=".3"/>
    <circle cx="1500" cy="330" r="4" fill-opacity=".22"/>
  </g>

  <!-- 左下拓扑 -->
  <g stroke="#1f6feb" stroke-opacity=".10" stroke-width="1.6" fill="none">
    <path d="M120 640 L260 580 L400 660"/>
    <path d="M260 580 L300 720 L120 640"/>
  </g>
  <g fill="#1f6feb">
    <circle cx="120" cy="640" r="5" fill-opacity=".2"/>
    <circle cx="260" cy="580" r="6" fill-opacity=".26"/>
    <circle cx="400" cy="660" r="5" fill-opacity=".18"/>
    <circle cx="300" cy="720" r="5" fill-opacity=".22"/>
  </g>

  <!-- 视频监控取景角标（左上，淡） -->
  <g stroke="#1f6feb" stroke-opacity=".18" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M150 130v-24a10 10 0 0 1 10-10h24"/>
    <path d="M270 130v-24a10 10 0 0 0-10-10h-24"/>
    <path d="M150 210v24a10 10 0 0 0 10 10h24"/>
    <path d="M270 210v24a10 10 0 0 1-10 10h-24"/>
  </g>
  <circle cx="210" cy="182" r="28" fill="none" stroke="#1f6feb" stroke-opacity=".18" stroke-width="4"/>
  <circle cx="210" cy="182" r="9" fill="#1f6feb" fill-opacity=".15"/>
</svg>
